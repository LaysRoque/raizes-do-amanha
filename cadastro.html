<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Cadastro | Raízes do Amanhã</title><link rel="stylesheet" href="../css/style.css"></head><body><header><div class="container topo"><a class="logo" href="index.html">🌱 Raízes do Amanhã</a><button class="menu-hamburguer" aria-label="Abrir menu">☰</button><ul class="nav-links"><li><a href="index.html">Início</a></li><li class="dropdown"><a href="projetos.html">Projetos</a><ul class="submenu"><li><a href="projetos.html">Educação</a></li><li><a href="projetos.html">Meio ambiente</a></li></ul></li><li><a href="cadastro.html">Cadastro</a></li></ul></div></header><main><section class="secao"><div class="container"><h1 class="titulo">Faça seu cadastro</h1><form class="formulario"><fieldset><legend>Dados pessoais</legend><div class="grupo"><label for="nome">Nome completo</label><input id="nome" type="text" placeholder="Digite seu nome" required></div><div class="grupo"><label for="email">E-mail</label><input id="email" type="email" placeholder="nome@email.com" required></div><div class="grupo"><label for="cpf">CPF</label><input id="cpf" type="text" placeholder="000.000.000-00" pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}" required></div></fieldset><fieldset><legend>Contato e endereço</legend><div class="grupo"><label for="tel">Telefone</label><input id="tel" type="tel" placeholder="(00) 00000-0000" pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}" required></div><div class="grupo"><label for="cep">CEP</label><input id="cep" type="text" placeholder="00000-000" pattern="[0-9]{5}-[0-9]{3}" required></div></fieldset><button class="btn" type="submit">Enviar cadastro</button></form><div class="toast">Cadastro enviado com sucesso! Obrigada por participar. 🌱</div></div></section></main><footer><p>© 2026 Raízes do Amanhã | Transformando vidas através da solidariedade.</p></footer><script>const b=document.querySelector(".menu-hamburguer"),n=document.querySelector(".nav-links");b?.addEventListener("click",()=>n.classList.toggle("ativo"));const f=document.querySelector("form"),t=document.querySelector(".toast");f?.addEventListener("submit",e=>{e.preventDefault();t.classList.add("ativo");setTimeout(()=>t.classList.remove("ativo"),3500)})</script></body></html>
